name: Importer les deux logos manquants
on:
  push:
    paths:
      - '.github/workflows/import-original-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Importer les PNG originaux et vérifier leurs empreintes Git
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error             "https://raw.githubusercontent.com/anderson76389/Kaptain-Collection/main/assets/kaptain-logo-mark.png"             --output assets/kaptain-logo-mark.png
          curl --fail --location --retry 3 --silent --show-error             "https://raw.githubusercontent.com/anderson76389/Kaptain-Collection/main/assets/kaptain-logo.png"             --output assets/kaptain-logo.png
          test "$(git hash-object assets/kaptain-logo-mark.png)" = "45d08e17d62c2b1da8694f3bd8c95af808a9c0bd"
          test "$(git hash-object assets/kaptain-logo.png)" = "20f1a1eaf823b32bf8cb6f8370c703837eaca5a3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/kaptain-logo-mark.png assets/kaptain-logo.png
          git commit -m "Conserver les deux logos PNG originaux sans modification"
          git push origin HEAD:main
