name: Tous les textes FR - remplacer & par Et
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-texts-fr.yml
      - scripts/normalize-ampersands.mjs
permissions:
  contents: write
concurrency:
  group: ma-collection-normalize-texts-fr
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe des scripts
        run: |
          node --check scripts/normalize-ampersands.mjs
          node --check site-fr.js
      - name: Remplacer les & visibles dans toutes les collections
        run: node scripts/normalize-ampersands.mjs --write
      - name: Vérifier qu'aucun texte visible ne conserve &
        run: |
          node scripts/normalize-ampersands.mjs --check
          node scripts/audit-fr-catalogs.mjs
      - name: Reconstruire la collection Nuvio complète en français
        run: |
          node scripts/build-fr-export.mjs --write
          node scripts/build-fr-export.mjs --check
      - name: Contrôler les catalogues historiques et leurs filtres
        run: |
          node --test tests/weekly-catalogs.test.cjs
          node --test tests/dynamic-audit.test.mjs
          node scripts/refresh-weekly-catalogs.mjs --check
      - name: Publier les titres français corrigés
        run: |
          git config user.name 'ma-collection-traduction'
          git config user.email 'actions@users.noreply.github.com'
          git add locales/fr.json locales/site-fr.json collections/*.json collections/database.js manifest.json manifest-complet.json export/nuvio-collection-fr.json
          if git diff --cached --quiet; then
            echo 'Tous les libellés étaient déjà conformes.'
          else
            git commit -m 'Remplacer toutes les esperluettes visibles par Et, sans modifier les identifiants [skip ci]'
            git pull --rebase
            git push
          fi
