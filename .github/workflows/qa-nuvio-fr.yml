name: Validation site FR et compatibilité Nuvio
on:
  push:
    branches:
      - main
      - fix/validation-nuvio-fr-20261011
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: qa-ma-collection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier l'inventaire des médias sans téléchargement
        run: |
          python3 -m py_compile scripts/media_migration.py
          python3 scripts/media_migration.py self-test
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Vérifier syntaxe de l'application
        run: |
          for f in app.js wizard.js customize.js nuvio-push.js account-ui.js account-vault.js profile-studio.js site-fr.js collections/test-channels.js; do
            node --check "$f"
          done
      - name: Charger le site local et simuler Nuvio
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/qa-http.log 2>&1 &
          sleep 3
          node .github/scripts/qa-nuvio-fr.mjs
          node .github/scripts/qa-controls.mjs
