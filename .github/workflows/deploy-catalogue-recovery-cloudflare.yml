name: Déployer manuellement le Worker de secours TMDB sur Cloudflare
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
        description: "Je confirme le déploiement du Worker ma-collection-catalogues sur mon compte Cloudflare"
permissions:
  contents: read
concurrency:
  group: ma-collection-cloudflare-catalogue-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la configuration Cloudflare sans exposer les identifiants
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configurer les secrets CLOUDFLARE_ACCOUNT_ID et CLOUDFLARE_API_TOKEN dans le depot Ma-Collection. Aucun déploiement."
            exit 2
          fi
      - name: Valider toutes les archives et le vérificateur live avant publication
        run: |
          node --test tests/cloudflare-catalogue-recovery.test.mjs tests/cloudflare-verify-live.test.mjs
          node services/catalogue-recovery-cloudflare/prepare-assets.mjs
      - name: Déployer le seul Worker ma-collection-catalogues
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/ma-collection-worker-deploy.log"
          if npx --yes wrangler@4.156.0 deploy --config services/catalogue-recovery-cloudflare/wrangler.toml 2>&1 | tee "$deploy_log"; then
            echo "::notice::Worker publié. Vérification à distance des 261 listes en cours."
          else
            if grep -Fq 'assets-upload-session' "$deploy_log" && grep -Fq 'No access to the specified resource' "$deploy_log"; then
              echo "::error title=Permissions Cloudflare refusées::Le jeton n'autorise pas le dépôt des fichiers statiques de ma-collection-catalogues dans CLOUDFLARE_ACCOUNT_ID. Vérifier que l'ID correspond au compte Cloudflare qui héberge ce Worker et que le token dispose de Workers Scripts Write sur ce compte. Pour créer un Worker inexistant avec les rôles granulaires : Workers Admin au niveau du produit Workers. Remplacer le secret CLOUDFLARE_API_TOKEN dans Ma-Collection, puis relancer manuellement."
              echo "::notice::Aucune nouvelle publication confirmée. Ne pas relancer avec le même jeton sans corriger ses droits."
            else
              echo "::error title=Échec de déploiement Cloudflare::Lire les lignes ERROR de Wrangler ci-dessus. Aucune publication validée."
            fi
            exit 1
          fi
      - name: Contrôler le Worker en ligne et relire les 261 listes depuis Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          node services/catalogue-recovery-cloudflare/verify-live.mjs --deploy-log="$RUNNER_TEMP/ma-collection-worker-deploy.log"
          echo "::notice::Déploiement vérifié à distance : les 261 listes correspondent aux archives Git et leurs fichiers internes sont protégés."
      - name: Confirmer le périmètre du déploiement
        run: |
          echo "::notice::Aucune modification de Ma-Collection, des catalogues actifs, du Worker de comptes Kovelyx ou du Worker des affiches Ma-Art."
