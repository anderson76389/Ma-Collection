name: Déployer manuellement le Worker de secours TMDB sur Cloudflare
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
        description: "Je confirme le déploiement du Worker ma-collection-catalogues sur mon compte Cloudflare"
permissions:
  contents: read
concurrency:
  group: ma-collection-cloudflare-catalogue-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la configuration Cloudflare sans exposer les identifiants
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configurer les secrets CLOUDFLARE_ACCOUNT_ID et CLOUDFLARE_API_TOKEN dans le depot Ma-Collection. Aucun déploiement."
            exit 2
          fi
      - name: Valider absolument toutes les archives avant publication
        run: |
          node --test tests/cloudflare-catalogue-recovery.test.mjs
          node services/catalogue-recovery-cloudflare/prepare-assets.mjs
      - name: Déployer un Worker séparé, jamais Kovelyx Cloud ou Ma-Art
        run: |
          npx --yes wrangler@4.156.0 deploy --config services/catalogue-recovery-cloudflare/wrangler.toml
      - name: Indiquer le chemin du test de production
        run: |
          echo "::notice::Consulter l'URL workers.dev dans les logs Wrangler, puis vérifier /health et /v1/tmdb/lists/8659010?limit=10."
          echo "::notice::Aucune modification de Ma-Collection, des catalogues actifs, du Worker de comptes Kovelyx ou du Worker des affiches Ma-Art."
